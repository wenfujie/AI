name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/deploy.yml'
      - 'amount-count/**'
      - 'glm-4-flash-demo/**'
      - 'deep-reading-mentor/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  build-projects:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 新增项目仅需改此矩阵
      matrix:
        include:
          - name: amount-count
            workdir: amount-count
            build_cmd: pnpm install --frozen-lockfile && pnpm build
            output_path: dist
            target_subdir: amount-count
          - name: glm-4-flash-demo
            workdir: glm-4-flash-demo
            build_cmd: ''
            output_path: index.html
            target_subdir: glm-4-flash-demo
          - name: deep-reading-mentor
            workdir: deep-reading-mentor
            build_cmd: pnpm install --frozen-lockfile && pnpm build
            output_path: dist
            target_subdir: deep-reading-mentor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        if: matrix.build_cmd != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        if: matrix.build_cmd != ''
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Build project
        if: matrix.build_cmd != ''
        working-directory: ${{ matrix.workdir }}
        run: ${{ matrix.build_cmd }}

      - name: Prepare project artifact
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="./${{ matrix.workdir }}/${{ matrix.output_path }}"
          TARGET="./artifact/${{ matrix.target_subdir }}"

          mkdir -p "$TARGET"

          if [ -d "$SOURCE" ]; then
            cp -R "$SOURCE"/. "$TARGET"/
          elif [ -f "$SOURCE" ]; then
            cp "$SOURCE" "$TARGET/index.html"
          else
            echo "::error::Output not found: $SOURCE"
            exit 1
          fi

      - name: Upload project artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.name }}
          path: ./artifact
          retention-days: 7

  deploy:
    needs: build-projects
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download project artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: site-*
          path: ./.pages-artifact
          merge-multiple: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.pages-artifact

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
